<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electric bill help</title>
<link rel="stylesheet" href="/chat/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Electric bill help · Fairfax County</h1>
      <div class="sub">For Dominion Energy customers. Plain answers, real phone numbers. No account numbers asked, ever.</div>
    </div>
    <div class="spacer"></div>
    <nav><a href="/">New chat</a><a href="/chats">Saved chats</a></nav>
  </header>
  <main id="main"></main>
</div>
<form class="compose" id="compose">
  <div class="inner">
    <textarea id="input" rows="1" placeholder="Describe your situation in your own words…" autofocus></textarea>
    <button class="primary" id="send" type="submit">Send</button>
    <button type="button" id="share" title="Get a link to this chat">Share</button>
  </div>
  <div class="inner" style="margin-top:8px"><div class="toolbar" id="toolbar"></div></div>
</form>
<script src="/chat/app.js"></script>
</body>
</html>
