<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree inspector</title>
<link rel="stylesheet" href="/style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .shell { display: flex; height: 100vh; }
  .stage { position: relative; flex: 1; min-width: 0; }
  .canvas { position: absolute; inset: 0; overflow: hidden; background: var(--bg); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 24px 24px; cursor: grab; }
  .canvas.dragging { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .world svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .topbar { position: absolute; left: 12px; top: 12px; z-index: 5; display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--panel) 95%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; box-shadow: 0 2px 8px #0002; }
  .topbar h1 { font-size: 14px; margin: 0 6px 0 0; }
  .topbar .muted { color: var(--muted); }
  .topbar button, .panel button { padding: 4px 9px; font-size: 12px; }
  .iconbtn { position: absolute; right: 12px; top: 12px; z-index: 5; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 95%, transparent); box-shadow: 0 2px 8px #0002; cursor: pointer; color: var(--ink); }
  .iconbtn:hover { background: var(--bg); }
  .iconbtn .count { position: absolute; top: -6px; right: -6px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 10px; padding: 1px 6px; }
  .panel { position: relative; width: 460px; max-width: calc(100vw - 72px); flex-shrink: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); }
  .panel.hidden { display: none; }
  .panel.expanded { width: calc(100vw - 72px); }
  body.popout .panel { width: 100%; max-width: 100%; border: 0; }
  .panel .grip { position: absolute; left: 0; top: 0; height: 100%; width: 6px; cursor: col-resize; z-index: 2; }
  .panel .grip:hover { background: #58b08860; }
  .panel .head { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .panel.chatmode .head .t, .panel.chatmode .head .sub, .panel.chatmode .section { display: none; }
  .panel:not(.chatmode) .chat, .panel:not(.chatmode) .back { display: none; }
  .panel.chatmode .head { position: absolute; top: 0; right: 0; border: 0; background: transparent; z-index: 3; }
  .panel .back { position: absolute; left: 10px; top: 8px; z-index: 3; font-size: 13px; text-decoration: none; padding: 4px 8px; border-radius: 8px; background: color-mix(in srgb, var(--panel) 92%, transparent); }
  .panel .back:hover { background: var(--bg); }
  .panel.chatmode .chat { padding-top: 40px; height: 100%; }
  .panel .head .t { font-weight: 600; }
  .panel .head .sub { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .panel .head .right { margin-left: auto; display: flex; gap: 2px; }
  .panel .head .right button { border: 0; background: transparent; padding: 5px; border-radius: 6px; color: var(--ink); }
  .panel .head .right button:hover { background: var(--bg); }
  .panel .section { border-bottom: 1px solid var(--line); }
  .panel .section > .sh { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); cursor: pointer; user-select: none; }
  .panel .section > .sh .n { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .panel .section.collapsed > .body { display: none; }
  .newrow { display: flex; gap: 6px; padding: 0 12px 10px; }
  .newrow select { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .list { list-style: none; margin: 0; padding: 0; max-height: 34vh; overflow: auto; }
  .list li { padding: 7px 12px; border-top: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .list li:hover { background: var(--bg); }
  .list li.active { background: var(--user); }
  .list li .m { color: var(--muted); font-size: 11px; }
  .chat { flex: 1; overflow: auto; }
  .chat .meta { margin: 10px 12px 4px; font-size: 12px; color: var(--muted); }
  .chat .msg { margin: 8px 12px; }
  .chat .bubble { max-width: 100%; font-size: 13px; padding: 8px 10px; }
  .chat .row { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .chat .row button { padding: 2px 8px; font-size: 11px; }
  .chat .verb { font-size: 11px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; margin-top: 6px; white-space: pre-wrap; display: none; }
  .chat .verb.show { display: block; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); }
  .pill.ok { border-color: var(--accent); color: var(--accent); }
  .pill.bad { border-color: #c33; color: #c33; }
  .sq { position: absolute; box-sizing: border-box; border: 2px solid #c9c5bb; border-radius: 8px; background: var(--panel); padding: 8px 10px; font-size: 12px; line-height: 1.35; overflow: hidden; white-space: pre-wrap; word-wrap: break-word; }
  .sq.root { border-color: #d99a1e; }
  .sq.hole { border-color: #c33; background: #fff3f3; }
  .sq.unreach { opacity: .45; }
  .sq.onpath { box-shadow: 0 0 0 4px #58b08880; border-color: var(--accent); }
  .sq.hot { box-shadow: 0 0 0 5px #1f5f3f; border-color: #1f5f3f; }
  .sq .badge { position: absolute; top: -10px; right: -10px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11px; padding: 1px 7px; font-weight: 600; }
  .sq .badge.zero { background: #bbb; }
  .sq .step { position: absolute; top: -10px; left: -10px; background: #1f5f3f; color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; font-weight: 600; }
  .sq .idtag { position: absolute; bottom: 2px; right: 6px; font-size: 9px; color: var(--muted); }
  .edge-label { font-size: 11px; fill: #444; }
  .callout { position: absolute; width: 300px; box-sizing: border-box; font-size: 11px; line-height: 1.35; z-index: 3; display: flex; flex-direction: column; gap: 4px; }
  .callout .r, .callout .h { max-width: 92%; padding: 6px 9px; border-radius: 14px; box-shadow: 0 1px 4px #0002; }
  .callout .r { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .callout .r { max-height: 6.5em; overflow: auto; }
  .callout .h { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--accent)); border-bottom-left-radius: 4px; max-height: 9em; overflow: auto; overscroll-behavior: contain; }
  .callout .k { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .callout .row { display: flex; gap: 6px; align-items: center; padding-left: 4px; }
  .callout .row button { padding: 1px 7px; font-size: 10px; }
  .callout .pill { font-size: 10px; padding: 0 6px; }
  .callout .tag { font-size: 9px; color: var(--c, var(--accent)); font-weight: 600; padding-left: 4px; }
  .tabs { display: flex; gap: 4px; padding: 6px 10px 0 110px; flex-wrap: wrap; }
  .tabs button { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .tabs button.on { border-color: var(--c); color: var(--c); font-weight: 600; }
  body.nocallouts .callout { display: none; }
  .busy { position: fixed; bottom: 14px; right: 14px; z-index: 9; background: #1f5f3f; color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; display: none; }
  .busy.show { display: block; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 16px; max-width: 560px; font: inherit; background: var(--panel); color: var(--ink); }
  dialog textarea { width: 100%; min-height: 160px; font: 12px monospace; }
  @media (prefers-color-scheme: dark) { .sq.hole { background: #3a2323; } .edge-label { fill: #ddd; } }
</style>
</head>
<body>
<div class="shell">
  <div class="stage" id="stage">
    <div class="topbar">
      <h1>Tree inspector</h1>
      <span id="treeinfo" class="muted">loading…</span>
      <button id="fit" type="button">Fit</button>
      <label class="muted" style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="calloutsOn" checked> chat on tree</label>
      <button id="importBtn" type="button" title="Paste the JSON from the editor's /api/tree/main/export">Import tree…</button>
      <a href="https://ai-energy-tool.mannanteam.workers.dev/" target="_blank" rel="noopener">Open editor</a>
    </div>
    <button class="iconbtn" id="openPanel" title="Open chats panel" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/><path d="M9 6h12M9 12h12M9 18h12"/></svg>
      <span class="count" id="chatCount"></span>
    </button>
    <div class="canvas" id="canvas"><div class="world" id="world"><svg id="edges"></svg><svg id="threads"></svg></div></div>
  </div>
  <aside class="panel hidden" id="panel">
    <div class="grip" id="grip"></div>
    <a class="back" id="back" href="#">← All chats</a>
    <div class="head">
      <span class="t">Chats</span><span class="sub" id="panelSub"></span>
      <div class="right">
        <button id="popout" title="Pop out into its own window" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></button>
        <button id="expand" title="Expand / restore" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14v6h6M20 10V4h-6M4 20l6-6M20 4l-6 6"/></svg></button>
        <button id="closePanel" title="Close" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
    <div class="section" id="secNew"><div class="sh">New chat</div><div class="body"><div class="newrow"><select id="scenario"></select><button id="newBtn" type="button" title="Run this scenario against the current tree">+ Run</button></div></div></div>
    <div class="section" id="secList"><div class="sh">Chats <span class="n" id="listCount"></span><label class="n" style="margin-left:8px;font-size:11px"><input type="checkbox" id="showArchived"> archived</label></div><div class="body"><ul class="list" id="chatlist"></ul></div></div>
    <div class="chat" id="chat"></div>
  </aside>
</div>
<div class="busy" id="busy">Running…</div>
<dialog id="importDlg">
  <p style="margin-top:0">Paste the JSON shown at <b>/api/tree/main/export</b> on the editor site (you must be signed in there). The chat and this view switch to it immediately.</p>
  <textarea id="importText" placeholder='{"version":1,"tree":{...},"nodes":[...],"edges":[...]}'></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button id="importCancel" type="button">Cancel</button><button id="importGo" type="button" class="primary">Import</button></div>
</dialog>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const POP = new URLSearchParams(location.search).get("panel") === "1";
  const KEY = "aet-inspector-chat";
  const canvas = $("#canvas"), world = $("#world"), svgEl = $("#edges"), chatEl = $("#chat"), list = $("#chatlist"), busy = $("#busy"), panel = $("#panel");
  let tree = null, data = null, current = null, view = { x: 40, y: 40, k: 0.8 };
  const shown = [];                                            // chat ids drawn on the canvas, side by side
  const COLORS = ["#1f5f3f", "#8a4b9c", "#b9651a", "#1f4f8a"];
  const colorOf = (id) => COLORS[Math.max(0, shown.indexOf(id)) % COLORS.length];
  const byId = {};
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const render = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
  const fmt = (x) => x == null ? "–" : x.toFixed(2);
  const apply = () => { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; };

  // panel open / close / expand / resize / pop out, like the editor's tree panel
  const setPanel = (open) => { panel.classList.toggle("hidden", !open); $("#openPanel").style.display = open ? "none" : ""; try { localStorage.setItem("aet-inspector-panel", open ? "1" : "0"); } catch {} };
  $("#openPanel").onclick = () => setPanel(true);
  $("#closePanel").onclick = () => setPanel(false);
  const setMode = (chat) => panel.classList.toggle("chatmode", chat);
  /** List mode: every listed chat is drawn on the canvas, one column each. */
  function showAll() {
    setMode(false); current = null; history.replaceState(null, "", location.pathname + location.search);
    shown.length = 0; for (const c of data.chats) shown.push(c.id);
    world.querySelectorAll(".sq .step").forEach((x) => x.remove());
    highlight(new Set(data.chats.flatMap((c) => c.messages.flatMap((m) => m.node_ids))), new Set());
    list.querySelectorAll("li").forEach((li) => li.classList.remove("active"));
    drawCallouts();
  }
  $("#back").onclick = (e) => { e.preventDefault(); showAll(); };
  $("#expand").onclick = () => panel.classList.toggle("expanded");
  $("#popout").onclick = () => window.open("/admin?panel=1" + (current ? "#chat=" + current : ""), "aet-inspector-panel", "popup=yes,width=720,height=900");
  let grip = null;
  $("#grip").addEventListener("mousedown", (e) => { grip = { x: e.clientX, w: panel.offsetWidth }; e.preventDefault(); });
  window.addEventListener("mousemove", (e) => { if (grip) panel.style.width = Math.min(window.innerWidth - 80, Math.max(320, grip.w + (grip.x - e.clientX))) + "px"; });
  window.addEventListener("mouseup", () => { grip = null; });
  for (const id of ["secNew", "secList"]) $("#" + id + " .sh").onclick = () => $("#" + id).classList.toggle("collapsed");
  if (POP) { document.body.classList.add("popout"); $("#stage").style.display = "none"; setPanel(true); $("#popout").style.display = "none"; $("#expand").style.display = "none"; $("#closePanel").style.display = "none"; }
  else { let open = "1"; try { open = localStorage.getItem("aet-inspector-panel") ?? "1"; } catch {} setPanel(open === "1"); }

  async function load() {
    [tree, data] = await Promise.all([fetch("/api/tree").then(r => r.json()), fetch("/api/admin/chats" + ($("#showArchived").checked ? "?archived=1" : "")).then(r => r.json())]);
    const r = tree.report;
    $("#treeinfo").textContent = `${tree.source} tree · ${r.nodes} squares · ${r.edges} arrows · ${r.holes.length} holes · ${r.unreachable.length} unreachable · updated ${tree.tree.updatedAt ? new Date(tree.tree.updatedAt).toLocaleString() : "?"}`;
    $("#chatCount").textContent = data.chats.length; $("#listCount").textContent = data.chats.length;
    if (!POP) drawTree();
    drawList();
    const want = current || (location.hash.match(/chat=([A-Za-z0-9]+)/) || [])[1];
    const c = want && data.chats.find(x => x.id === want);
    if (c) showChat(c, false, true); else showAll();
  }

  function drawTree() {
    world.querySelectorAll(".sq").forEach(e => e.remove());
    for (const k in byId) delete byId[k];
    const holes = new Set(tree.report.holes), unreach = new Set(tree.report.unreachable);
    for (const n of tree.nodes) {
      byId[n.id] = n;
      const d = document.createElement("div");
      d.className = "sq" + (n.isRoot ? " root" : "") + (holes.has(n.id) ? " hole" : "") + (unreach.has(n.id) ? " unreach" : "");
      d.style.left = n.x + "px"; d.style.top = n.y + "px"; d.style.width = (n.width || 240) + "px"; d.style.height = (n.height || 120) + "px";
      d.dataset.id = n.id;
      d.textContent = n.text || "(empty square: hole → 2-1-1 fallback)";
      const v = data.visits[n.id] || 0;
      const b = document.createElement("span"); b.className = "badge" + (v ? "" : " zero"); b.textContent = v; b.title = v + " helper replies came from this square"; d.append(b);
      const t = document.createElement("span"); t.className = "idtag"; t.textContent = n.id; d.append(t);
      world.append(d);
    }
    let s = "";
    for (const e of tree.edges) {
      const a = byId[e.source], b = byId[e.target]; if (!a || !b) continue;
      const x1 = a.x + (a.width || 240) / 2, y1 = a.y + (a.height || 120), x2 = b.x + (b.width || 240) / 2, y2 = b.y, my = (y1 + y2) / 2;
      s += `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" fill="none" stroke="#777" stroke-width="1.6" marker-end="url(#arr)"/>`;
      if (e.label) s += `<rect x="${(x1 + x2) / 2 - 22}" y="${my - 9}" width="44" height="18" rx="4" fill="#fff" stroke="#ddd"/><text class="edge-label" x="${(x1 + x2) / 2}" y="${my + 4}" text-anchor="middle">${esc(e.label)}</text>`;
    }
    svgEl.innerHTML = `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>` + s;
    fit();
  }
  function fit() {
    if (!tree?.nodes.length) return;
    const xs = tree.nodes.map(n => n.x), ys = tree.nodes.map(n => n.y), xe = tree.nodes.map(n => n.x + (n.width || 240)), ye = tree.nodes.map(n => n.y + (n.height || 120));
    const w = Math.max(...xe) - Math.min(...xs), h = Math.max(...ye) - Math.min(...ys);
    const k = Math.min((canvas.clientWidth - 60) / w, (canvas.clientHeight - 100) / h, 1.2);
    view = { k, x: 30 - Math.min(...xs) * k, y: 70 - Math.min(...ys) * k }; apply();
  }
  $("#fit").onclick = fit;
  let drag = null;
  canvas.addEventListener("mousedown", (e) => { drag = { x: e.clientX - view.x, y: e.clientY - view.y }; canvas.classList.add("dragging"); });
  window.addEventListener("mousemove", (e) => { if (drag) { view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; apply(); } });
  window.addEventListener("mouseup", () => { drag = null; canvas.classList.remove("dragging"); });
  canvas.addEventListener("wheel", (e) => { if (e.target.closest(".callout .h, .callout .r")) return; e.preventDefault(); const k = Math.min(2.5, Math.max(0.2, view.k * (e.deltaY < 0 ? 1.1 : 0.9))); const r = canvas.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top; view.x = mx - (mx - view.x) * (k / view.k); view.y = my - (my - view.y) * (k / view.k); view.k = k; apply(); }, { passive: false });

  function drawList() {
    list.innerHTML = "";
    for (const c of data.chats) {
      const li = document.createElement("li"); li.dataset.id = c.id; if (c.id === current) li.classList.add("active");
      const t = document.createElement("div"); t.textContent = (c.scenario || c.title || c.id).slice(0, 60);
      const m = document.createElement("div"); m.className = "m";
      m.textContent = [c.source + (c.parent_id ? " of " + c.parent_id + "@" + c.parent_seq : ""), c.status, Math.floor(c.message_count / 2) + " turns", new Date(c.created_at).toLocaleString(), c.archived ? "archived" : ""].filter(Boolean).join(" · ");
      li.append(t, m); li.onclick = () => showChat(c, true); list.append(li);
    }
  }
  $("#calloutsOn").onchange = (e) => document.body.classList.toggle("nocallouts", !e.target.checked);
  $("#showArchived").onchange = () => load();
  function drawCallouts() {
    world.querySelectorAll(".callout").forEach((e) => e.remove());
    $("#threads").innerHTML = "";
    if (POP) return;
    shown.forEach((cid, col) => { const c = data.chats.find((x) => x.id === cid); if (c) drawChatCallouts(c, col); });
    drawThreads();
  }
  /** A line in the chat's colour from each bubble to the next one of the same chat. */
  function drawThreads() {
    let s = "";
    for (const cid of shown) {
      const els = [...world.querySelectorAll(`.callout[data-chat="${cid}"]`)];
      for (let i = 0; i + 1 < els.length; i++) {
        const a = els[i], b = els[i + 1];
        const x1 = a.offsetLeft + 24, y1 = a.offsetTop + a.offsetHeight, x2 = b.offsetLeft + 24, y2 = b.offsetTop;
        const my = (y1 + y2) / 2;
        s += `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" fill="none" stroke="${colorOf(cid)}" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"/>`;
      }
    }
    $("#threads").innerHTML = s;
  }
  function drawChatCallouts(c, col) {
    const used = {};
    let lastUser = null;
    for (const m of c.messages) {
      if (m.role === "user") { lastUser = m; continue; }
      const id = m.node_ids.find((x) => byId[x]); if (!id) continue;
      const n = byId[id]; const k = used[id] = (used[id] || 0) + 1;
      const d = document.createElement("div"); d.className = "callout"; d.dataset.chat = c.id; d.style.setProperty("--c", colorOf(c.id));
      d.style.left = (n.x + (n.width || 240) + 14 + col * 314) + "px"; d.style.top = (n.y + (k - 1) * 30) + "px";
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = (c.parent_id ? "rerun " : "") + c.id; if (shown.length > 1) d.append(tag);
      const r = document.createElement("div"); r.className = "r"; r.textContent = lastUser ? lastUser.content : ""; if (lastUser) d.append(r);
      const h = document.createElement("div"); h.className = "h"; h.innerHTML = render(m.content); h.title = "square " + m.node_ids.join(", "); d.append(h);
      const row = document.createElement("div"); row.className = "row";
      if (m.review) { const p = document.createElement("span"); p.className = "pill " + (m.review.used === "written" ? "ok" : "bad"); p.textContent = m.review.used; p.title = m.review.reason || `covers ${fmt(m.review.covers)} adds-nothing ${fmt(m.review.adds_nothing)} asks-same ${fmt(m.review.tone)}`; row.append(p); }
      const rr = document.createElement("button"); rr.type = "button"; rr.textContent = "↻ rerun from here"; rr.onclick = (e) => { e.stopPropagation(); rerun(c.id, m.seq); }; row.append(rr);
      d.append(row);
      d.addEventListener("mousedown", (e) => e.stopPropagation());
      d.onmouseenter = () => highlight(new Set(c.messages.flatMap((x) => x.node_ids)), new Set(m.node_ids));
      d.onclick = () => { if (current !== c.id) showChat(c, true, true); };
      world.append(d);
    }
  }
  function highlight(ids, hot) {
    world.querySelectorAll(".sq").forEach(d => { d.classList.toggle("onpath", ids.has(d.dataset.id)); d.classList.toggle("hot", hot.has(d.dataset.id)); });
  }
  function showChat(c, user, keep) {
    if (!keep) shown.length = 0;
    if (!shown.includes(c.id)) shown.push(c.id);
    current = c.id; setMode(true); setPanel(true);
    if (user) { try { localStorage.setItem(KEY, c.id); } catch {} history.replaceState(null, "", "#chat=" + c.id); }
    list.querySelectorAll("li").forEach(li => li.classList.toggle("active", li.dataset.id === c.id));
    $("#panelSub").textContent = c.id;
    const path = new Set(); let step = 0;
    world.querySelectorAll(".sq .step").forEach(e => e.remove());
    for (const m of c.messages) for (const id of m.node_ids) { path.add(id); const d = world.querySelector(`.sq[data-id="${id}"]`); if (d && !d.querySelector(".step")) { const s = document.createElement("span"); s.className = "step"; s.textContent = ++step; d.prepend(s); } }
    highlight(path, new Set());
    drawCallouts();
    chatEl.innerHTML = "";
    if (shown.length > 1) {
      const tabs = document.createElement("div"); tabs.className = "tabs";
      for (const id of shown) { const b = document.createElement("button"); b.type = "button"; b.textContent = id === c.id ? id : (data.chats.find((x) => x.id === id)?.parent_id ? "rerun " : "") + id; b.style.setProperty("--c", colorOf(id)); b.classList.toggle("on", id === c.id); b.onclick = () => { const x = data.chats.find((y) => y.id === id); if (x) showChat(x, true, true); }; tabs.append(b); }
      chatEl.append(tabs);
    }
    const meta = document.createElement("div"); meta.className = "meta";
    meta.innerHTML = `${esc(c.source)}${c.scenario ? " · scenario <b>" + esc(c.scenario) + "</b>" : ""} · ${c.status}${c.state.ended_reason ? " (" + esc(c.state.ended_reason) + ")" : ""} · tree ${c.tree_updated_at ? new Date(c.tree_updated_at).toLocaleString() : "?"}` + (c.parent_id ? ` · rerun of <a href="#" data-goto="${c.parent_id}">${c.parent_id}</a> from reply #${c.parent_seq}` : "") + ` · <a href="/c/${c.id}" target="_blank">open</a>`;
    meta.querySelector("[data-goto]")?.addEventListener("click", (e) => { e.preventDefault(); const p = data.chats.find(x => x.id === e.target.dataset.goto); if (p) showChat(p, true); });
    chatEl.append(meta);
    for (const m of c.messages) {
      const wrap = document.createElement("div"); wrap.className = "msg " + m.role;
      const b = document.createElement("div"); b.className = "bubble";
      const who = document.createElement("div"); who.className = "who"; who.textContent = m.role === "user" ? "Resident" : "Helper"; b.append(who);
      const body = document.createElement("div"); body.innerHTML = render(m.content); b.append(body);
      if (m.role === "assistant") {
        const row = document.createElement("div"); row.className = "row";
        const sq = document.createElement("span"); sq.textContent = m.node_ids.length ? "square " + m.node_ids.join(", ") : "no square"; row.append(sq);
        const rv = m.review;
        if (rv) { const p = document.createElement("span"); p.className = "pill " + (rv.used === "written" ? "ok" : "bad"); p.textContent = rv.used === "written" ? `written · covers ${fmt(rv.covers)} adds-nothing ${fmt(rv.adds_nothing)} asks-same ${fmt(rv.tone)}` : "verbatim · " + (rv.reason || ""); p.title = "Jev review of DeepSeek's wording against the square"; row.append(p); }
        const rr = document.createElement("button"); rr.type = "button"; rr.textContent = "↻ rerun from here"; rr.title = "Replay the resident's messages up to this reply through the current tree, then let the resident continue"; rr.onclick = () => rerun(c.id, m.seq); row.append(rr);
        b.append(row);
        if (m.verbatim && m.verbatim !== m.content) { const vb = document.createElement("button"); vb.type = "button"; vb.textContent = "square text"; const v = document.createElement("div"); v.className = "verb"; v.textContent = m.verbatim; vb.onclick = () => v.classList.toggle("show"); row.append(vb); b.append(v); }
        b.onmouseenter = () => highlight(path, new Set(m.node_ids)); b.onmouseleave = () => highlight(path, new Set());
      }
      wrap.append(b); chatEl.append(wrap);
    }
  }
  // a pop-out window and the main window follow each other's selection
  window.addEventListener("storage", (e) => { if (e.key === KEY && e.newValue && e.newValue !== current && data) { const c = data.chats.find(x => x.id === e.newValue); if (c) showChat(c); } });

  async function run(url, body) {
    busy.classList.add("show");
    try { const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); const j = await r.json(); if (!r.ok) { alert(j.error || "failed"); return null; } return j; }
    finally { busy.classList.remove("show"); }
  }
  async function rerun(id, seq) { const j = await run(`/api/chats/${id}/rerun`, { seq }); if (j) { await load(); const c = data.chats.find((x) => x.id === j.id); if (c) showChat(c, true, true); } }
  $("#newBtn").onclick = async () => { const j = await run("/api/admin/new", { scenario: $("#scenario").value }); if (j) { current = j.id; await load(); } };
  $("#importBtn").onclick = () => $("#importDlg").showModal();
  $("#importCancel").onclick = () => $("#importDlg").close();
  $("#importGo").onclick = async () => { let doc; try { doc = JSON.parse($("#importText").value); } catch { alert("That is not JSON"); return; } const j = await run("/api/tree/import", doc); if (j) { $("#importDlg").close(); if (j.warnings?.length) alert("Imported with warnings:\n" + j.warnings.join("\n")); await load(); } };
  fetch("/api/admin/scenarios").then(r => r.json()).then(sc => { const sel = $("#scenario"); for (const s of sc) { const o = document.createElement("option"); o.value = s.name; o.textContent = s.name + " — " + s.opener.slice(0, 50); sel.append(o); } });
  load();
})();
</script>
</body>
</html>
